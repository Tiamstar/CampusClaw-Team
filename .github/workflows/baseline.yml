name: Baseline checks and images
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install security tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pip-audit==2.10.1
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --pattern '*checksums.txt' --dir /tmp/gitleaks
          cd /tmp/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Start clean database and build backend
        run: |
          python scripts/setup_local.py
          docker compose up -d --wait db
          docker compose build backend
      - name: Functional gate
        run: python scripts/check.py
      - name: Security gate
        run: python scripts/check.py --security
      - name: Validate specifications
        run: npx --yes --package=@fission-ai/openspec@1.15.0 openspec validate --all --strict --no-interactive
      - name: Build delivery images
        run: |
          docker compose build frontend campus-tools sandbox-runner
          docker compose --profile build build sandbox-image
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          python scripts/smoke.py --sandbox
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/commit.txt
          docker compose images --format json > build-evidence/images.json
          docker image save campusclaw-team-backend campusclaw-team-frontend | gzip > build-evidence/baseline-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ github.sha }}
          path: build-evidence/
          retention-days: 7
      - name: Clean test services
        if: always()
        run: docker compose down
