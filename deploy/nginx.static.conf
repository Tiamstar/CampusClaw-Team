server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # The HTTPS edge routes business endpoints directly to the backend.
    location ~ ^/(api|admin|static|health)/ { return 404; }
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
