schema: spec-driven

context: |
  项目为 CampusClaw 2.0 智能测验、课程答疑与学情分析扩展平台。
  当前是新仓库的规约初稿，没有已验收业务实现，不得将计划写成完成。
  课程底座计划复用，但讲义、助手、作业主路径和五项 AI 能力仍须验收。
  P0 新增为 E1 测验、E3 论坛、E4 成绩册、E5 知识图谱。
  P1 为 E2 互动、E6 预览笔记、E7 通知日程，可按进度裁剪。
  规划技术栈为 Vue 3、TypeScript、Django、DRF、PostgreSQL；实际底座待核对。
  成员为李非凡和陈志康，负责自身功能线并交叉验收对方的实现。
  AI 仅生成建议和草稿；成绩、权限与发布由确定性逻辑和授权用户控制。
  所有资源按真实课程/班级成员关系授权；模型密钥只在服务端。
  文档使用中文，Requirement 使用 SHALL，Scenario 使用 GIVEN/WHEN/THEN。

rules:
  proposal:
    - 写明课程要求或选题来源、范围、不做事项、依赖、风险和待确认决策。
    - 明确当前为提议状态，不宣称已实现、已上线或已验收。
  specs:
    - 每项 Requirement 包含稳定编号、操作者、可观察行为和边界。
    - 每项 Requirement 至少有一个四级 Scenario，补充权限或失败路径。
    - 不用模型声称完成代替测试、日志、数据和独立验收证据。
  design:
    - 区分既有底座假设与本组新增设计，记录一致性和权限检查位置。
  tasks:
    - 使用未勾选任务，覆盖实现、自测、失败路径与交叉验收。
